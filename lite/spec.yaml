# NF-3D Lite: sub-$50 brushed micro quad. Single source of truth for lite/.
# Same schema as spec/vehicle.yaml so prop/propulsion.py runs on it unchanged.
# SI units unless the key says mm/g. Bought-part masses are typical listings (VERIFY on a scale).
name: NF-3D Lite
description: ~100 mm brushed micro quad, 1S, ESP32 flight controller on a school-milled board, Xbox controller over Bluetooth

geometry_mm:
  arm_xy: 36.0            # |x| = |y| of each motor axis (X layout): 101.8 mm motor-to-motor diagonal
  prop_diameter: 65.0     # 2-blade push-fit prop (v3: 1.0 mm shaft, to match the high-speed 8520s)
  prop_band: 4.0          # axial thickness of the spinning prop (hub height)
  prop_gap_above_motor: 1.0   # motor top -> prop hub bottom (shaft stub)
  plate_thickness: 1.6    # centre plate (v2: 2.0 -> 1.6; the side rims and arm roots carry the bending)
  plate_windows: [[0, 0, 16, 20], [19.5, 0, 7, 20], [-19.5, 0, 7, 20]]   # v2 lightening/wire windows [cx, cy, w, h]
  centre_x: 50.0          # centre plate (x forward), carries the board
  centre_y: 42.0
  arm_root_width: 7.5     # v2: tapered arms, wide where the bending moment is largest
  arm_tip_width: 5.0
  arm_height: 4.0         # arms are tall rather than wide: bending stiffness against the motor thrust
  arm_root_fillet: 4.0
  motor_bore: 8.5         # 8520 motor body; print test piece and adjust for a firm press fit (PLA shrink)
  motor_tube_wall: 1.5    # grip section around the motor
  motor_pedestal_wall: 1.0    # v2: thin pedestal below the motor, with diamond vent windows
  motor_grip_length: 10.0     # tube length that holds the motor (slotted, zip-tie groove)
  motor_tube_z: [0.0, 22.5]   # tube extent; starts on the print bed so the frame prints flat with no supports
  motor_z0: 12.5          # v2 (was 10): +2.5 mm so the props clear the ESP32 module by >4 mm
  motor_slit_width: 1.0   # v2: clamp slit; a zip tie in the groove squeezes the tube onto the motor
  board_holes: [19.0, 15.0]   # M2 holes at (+-19, +-15): must match lite/ecad board
  board_hole: 1.8         # M2 self-tapping into PLA
  board_boss_od: 5.0
  board_boss_height: 11.5 # plate top -> board bottom: battery (8 mm + foam tape) plus the bottom-side SMD parts
  board_underside_parts: 1.6  # tallest bottom-side part (SOD-123/SOT-23 ~1.35 mm) + flush-trimmed THT tails
  board_size: [46.0, 38.0, 1.6]
  avionics_height: 14.0   # board top -> top of the plugged-in ESP32 module (female headers + module)
  esp32_module: {size: [31.0, 39.0], centre: [2.55, 4.3]}   # MiniKit outline in body FLU from lite/ecad (antenna towards +y)
  esp32_header_height: 8.5   # female header body: board top -> module underside
  imu_module: {x: [-5.1, 11.1], y: [-3.8, 17.1], height: 4.0}   # GY-521 on the board top, under the ESP32
  charger_module: {x: [-8.8, 17.2], y: [-21.3, -3.8], height: 4.5}   # TP4056 module on the board top, under the ESP32
  battery_stop: {x: [-27.0, -26.0], y_centres: [-9.0, 9.0], width: 3.0, height: 4.0}   # rear stops (v3: 2 mm further back, CoG)
  frame_material: petg_print
  guard:                  # v2 optional clip-on prop guard (lite/frame.py guard()); checks run with and without
    fit: false
    height: 3.0
    ring_radius: 35.0     # inner radius; the 65 mm prop tip circle is 32.5
    ring_width: 1.2       # neighbouring rings overlap at the mid-lines and fuse into one piece
    spoke_width: 1.6
    spoke_angle_deg: 60
    collar_wall: 1.2
    collar_clearance: 0.0 # v3 audit: snug clip on the tube (it touches; 0.1 left it floating)
  strap_slot: [12.0, 2.5] # battery strap slots [length along x, width]: one each side of the battery, so a strap
  strap_slot_y: 13.75     # over the battery top goes down its sides, through the plate and joins underneath (v3 audit:
                          # the v2 slots sat under the battery, where no strap could reach them)
  # v3 autonomy mounts (lite/frame.py): flow + ToF on a tail tab looking down, camera board on a
  # nose arch that the battery slides through. fit: false gives the v2 frame back.
  autonomy:
    fit: true
    tail_tab: {x: [-50.0, -24.0], half_width: 15.0, rim: 2.0}   # the modules sit on a 2 mm rim round a window
    nose_tab: {x: [24.0, 41.0], half_width: 15.5, bar: 3.0}   # two side bars (the battery slides between them)
    flow_module: {size: [19.0, 14.0, 3.5], centre: [-38.7, -7.5], window: 7.0}       # PMW3901 breakout, lens down
    tof_module: {size: [18.0, 13.0, 2.5], centre: [-38.7, 8.0], window: [6.0, 4.0]}  # VL53L1X breakout, sensor down
    arch: {x0: 39.0, thickness: 1.6, half_width: 15.5, height: 30.0,
           opening_half_width: 13.0, opening_wall: 10.6, flank_deg: 50.0, tie_slot: [1.2, 4.0],
           corner_r: 4.0, lens_hole_r: 3.3, lens_z: 26.3}  # lens above the tie and the opening  # battery (25 x 8) passes under
    camera: {size: [17.5, 21.0, 15.0], y_centre: 2.75, z0: 11.0}   # XIAO ESP32-S3 Sense [y, z, depth], camera face taped to the
                                                                  # arch's back, lens through the opening; offset to +y to clear the USB charging plug
  min_clearance: 1.0
  prop_tip_gap: 1.0       # used as the minimum prop-to-anything gap

materials:   # density kg/m^3, E Pa, nu, strength Pa (design allowable)
  pla_print:  {density: 1240, E: 3.0e+9, nu: 0.36, strength: 2.5e+7}   # 100 % infill, layer-line knockdown included
  petg_print: {density: 1270, E: 2.0e+9, nu: 0.38, strength: 3.0e+7}   # v2 default: softens ~80 C vs PLA ~55-60 C (motor heat)

parts:
  motor:      {qty: 4, mass_g: 4.0,  envelope_mm: {diameter: 8.5, height: 20.0}, ref: "8520 coreless brushed, high-speed (~53,000 rpm at 3.7 V), 1.0 mm shaft"}
  prop:       {qty: 4, mass_g: 0.6,  ref: "65 mm 2-blade push-fit"}
  battery:    {qty: 1, mass_g: 16.0, x_offset: -1.5, envelope_mm: {x: 48.0, y: 25.0, z: 8.0}, ref: "1S 3.7 V 600 mAh 40C low-IR (GNB / BetaFPV class), PH2.0"}
  board:      {qty: 1, mass_g: 8.0,  ref: "school-milled 2-layer FR4 46x38x1.6 with MOSFETs, LDO, passives, headers"}
  esp32:      {qty: 1, mass_g: 6.0,  ref: "ESP32 D1 mini (classic ESP32-WROOM-32)"}
  imu:        {qty: 1, mass_g: 2.0,  ref: "MPU-6050 GY-521 breakout"}
  charger:    {qty: 1, mass_g: 2.0,  ref: "TP4056 module with protection"}
  hardware:   {qty: 1, mass_g: 1.5,  ref: "4x M2 screws, battery strap"}
  wiring:     {qty: 1, mass_g: 2.0,  ref: "motor leads, battery lead"}
  # v3 autonomy hardware (masses: typical listings, VERIFY)
  flow:       {qty: 1, mass_g: 1.2,  ref: "PMW3901 optical-flow breakout (SPI, 3.3 V)"}
  tof:        {qty: 1, mass_g: 0.6,  ref: "VL53L1X ToF breakout (I2C, 3.3 V, 4 m)"}
  camera:     {qty: 1, mass_g: 5.0,  ref: "Seeed XIAO ESP32-S3 Sense (OV2640/OV3660 camera, Wi-Fi)"}
  autonomy_wiring: {qty: 1, mass_g: 1.5, ref: "sensor + companion leads, foam tape"}

electrical:
  cells: 1
  cell_v_nominal: 3.7
  cell_v_full: 4.2
  cell_v_empty: 3.4       # ESP32 LDO dropout limit: land at 3.4 V under load
  capacity_mah: 600
  c_rating_continuous: 40
  c_rating_burst: 40
  pack_ir_ohm: 0.045      # v3: 1S 600 mAh 40C low-IR pack (25C generic ~0.09), VERIFY
  usable_fraction: 0.80
  esc_continuous_a: 5.0   # AO3400A low-side switch, ~5 A with these copper areas
  esc_efficiency: 0.95    # MOSFET + Schottky losses
  avionics_w: 0.6         # ESP32 with Bluetooth active (~150 mA) + IMU + LED
  avionics_autonomy_w: 1.4  # v3 companion: XIAO ESP32-S3 streaming VGA over Wi-Fi (~300 mA at 3.8 V, VERIFY) + PMW3901 + VL53L1X

motor:   # 8520 coreless, typical listing figures (VERIFY: spin up on a bench supply and log current)
  kv_rpm_per_v: 14300      # 53,000 rpm no-load at 3.7 V (8520CL listing)
  rm_ohm: 0.50            # high-current 8520 variants list 0.4-0.6 ohm. The 8520CL stall figure (5.1 A) implies
                          # ~0.73 ohm incl. brushes: checks.py reports that as the "worst listing" case
  i0_a: 0.15
  i0_ref_v: 3.7
  rotor_inertia_kgm2: 3.0e-9
  max_current_a: 3.5

propeller:  # 65 mm toy 2-blade, static coefficients (n in rev/s, D in m)
  ct: 0.095
  cp: 0.050
  duct_thrust_gain: 1.0
  inertia_kgm2: 2.0e-9

environment:
  rho: 1.225
  g: 9.81

pessimistic:   # same corner definition as v1
  ct_scale: 0.85
  cp_scale: 1.20
  mass_scale: 1.05

requirements:
  max_auw_g: 85.0
  min_thrust_to_weight: 1.6     # a brushed micro flies at ~1.6-2.5; below 1.5 it can't climb out of a wobble
  max_hover_throttle: 0.75
  min_hover_time_min: 4.0
  max_cog_offset_xy_mm: 2.0
  max_esc_current_fraction: 0.85

# The pessimistic corner (motors 15 % weaker, props 20 % hungrier, 5 % heavier) must
# still hover with control margin; full performance is only required at nominal.
# A brushed 8520 is motor-limited (bigger props don't help: 65 -> 75 mm adds 1 g of
# thrust), so the real fix for a weak corner is measuring the motors you get.
requirements_pessimistic:
  min_thrust_to_weight: 1.3
  max_hover_throttle: 0.80
  min_hover_time_min: 3.0

# Flight simulation (lite/fly.py, neuroflight-fc simulator). Values the CAD/propulsion
# models don't give; mass, inertia, arm, thrust curve and yaw coefficient come from
# lite/out/checks.json.
sim:
  # coreless 8520 + 65 mm prop. The DC-motor model gives ~2.5 ms (rotor inertia only),
  # which is optimistic: measured micro brushed setups are tens of ms. Conservative:
  motor_tau_up: 0.040      # s
  motor_tau_down: 0.060    # s (no active braking on a low-side MOSFET drive)
  idle_command: 0.0        # brushed drive: motors stop at zero
  max_body_rate: [6.0, 6.0, 4.0]   # rad/s, angle-mode outer loop limits
  lin_drag_scale_by_mass: true     # reference drag scaled by mass (similar shape, smaller)
  angle_kp: [6.0, 6.0]     # 1/s, attitude error -> rate setpoint (ESP-Drone angle mode ~5.9)
  sensing: imu_only        # angle mode: filtered gyro + Mahony on the accelerometer
  # v3 position hold (lite/autonomy.py == lite_fc PositionHold): flow + ToF KF from neuroflight-fc
  pos_hold:
    kp_pos: [1.6, 1.6, 2.0]       # 1/s   position error -> velocity (gains close to neuroflight-fc CascadedPID)
    kp_vel: [4.0, 4.0, 5.0]       # 1/s   velocity error -> acceleration
    ki_vel: [0.4, 0.4, 3.0]       # 1/s^2 integrator (wind, CoG offset, thrust-model error: z needs the authority)
    i_limit: [2.0, 2.0, 4.0]      # m/s^2
    v_max: [1.5, 1.5, 1.0]        # m/s when returning to the hold point (commands are limited to cmd_v_max)
    cmd_v_max: [1.0, 1.0, 0.6]    # m/s, stick / companion velocity commands
    a_max_xy: 4.0                 # m/s^2 (~22 deg of tilt)
    max_tilt_rad: 0.5             # 29 deg
    flow_hz: 100                  # PMW3901 rate; the KF also runs the ToF at this rate
